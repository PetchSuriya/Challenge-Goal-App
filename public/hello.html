<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <style>
      body { display:flex; flex-direction:column; align-items:center; font-family:Arial, sans-serif; }
      .avatar-list { display:flex; gap:16px; }
      .avatar { width:96px; height:96px; border-radius:50%; background:linear-gradient(180deg,#eee,#ccc); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; font-weight:bold; }
      .badge { position:absolute; right:-6px; top:-6px; background:#ffcc00; color:#111; padding:4px 6px; border-radius:12px; font-size:12px; border:2px solid #fff; }
      .controls { margin-top:16px; }
      .empty { color:#666 }

  /* stage / equip view */
  #stage { width:600px; height:400px; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; margin-top:20px; position:relative; }
  #avatarBox { width:220px; height:320px; background:#eee; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold; position:relative }
  /* removed slot visuals (head/body/hand) from this page; keep only avatar and inline overlay */
    </style>
  </head>
  <body>
    <h1>Players</h1>
    <div id="avatars" class="avatar-list"></div>

    <h2>Your Avatar</h2>
      <div id="stage">
      <div id="avatarBox">Avatar</div>
    </div>

    <div class="controls">
      <button id="customizeBtn" disabled>Customize (disabled)</button>
      <button id="goalsBtn" style="margin-left:8px;">Goals</button>
      <button id="friendsBtn" style="margin-left:8px;">Friends</button>
      <form id="logoutForm" style="display:inline-block;margin-left:12px;">
        <button type="submit">Logout</button>
      </form>
    </div>

    <script>
      // Load the current user and their active avatar; show equipped item (read-only)
      async function loadActiveAvatar(){
        try {
          const meRes = await fetch('/api/me');
          if (!meRes.ok) { location.href = '/login.html'; return; }

          const me = await meRes.json();
          const box = document.getElementById('avatarBox');

              if (!me || !me.avatar_id) {
                box.textContent = 'No avatar';
                // keep customize button disabled when there's no avatar
                document.getElementById('customizeBtn').disabled = true;
                return;
              }

              const avRes = await fetch('/api/avatar/' + me.avatar_id);
              if (!avRes.ok) { box.textContent = 'Unable to load avatar'; return; }

              const av = await avRes.json();
              box.textContent = av.name || 'Avatar';

              // show small overlay for the equipped item (if any)
              if (av.equipped && av.equipped.name) {
                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.top = '8px';
                overlay.style.right = '8px';
                overlay.style.background = 'rgba(0,0,0,0.6)';
                overlay.style.color = '#fff';
                overlay.style.padding = '4px 6px';
                overlay.style.borderRadius = '4px';
                overlay.style.fontSize = '12px';
                overlay.textContent = av.equipped.name;
                box.appendChild(overlay);
              }

              // enable customize button and point it at the user's avatar
              const customizeBtn = document.getElementById('customizeBtn');
              customizeBtn.disabled = false;
              customizeBtn.textContent = 'Customize';
              customizeBtn.onclick = () => { window.location = '/customize.html?avatar=' + encodeURIComponent(me.avatar_id); };
        } catch (err) {
          console.error(err);
          document.getElementById('avatarBox').textContent = 'Error loading avatar';
        }
      }

      // Example: populate the player list (optional; depends on your API)
      async function loadPlayers(){
        try {
          const res = await fetch('/api/players');
          if (!res.ok) return;
          const players = await res.json(); // expect [{id, name, isOnline}] etc.
          const wrap = document.getElementById('avatars');
          wrap.innerHTML = '';
          if (!players || players.length === 0){
            wrap.innerHTML = '<span class="empty">No players</span>';
            return;
          }
          players.forEach(p=>{
            const div = document.createElement('div');
            div.className = 'avatar';
            div.textContent = (p.name || 'Player').slice(0,8);
            if (p.isOnline){
              const b = document.createElement('span');
              b.className = 'badge';
              b.textContent = 'ON';
              div.appendChild(b);
            }
            wrap.appendChild(div);
          });
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById('logoutForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        try { await fetch('/api/logout', { method:'POST' }); }
        finally { location.href = '/login.html'; }
      });

      loadActiveAvatar();
      loadPlayers();
      document.getElementById('friendsBtn').addEventListener('click', ()=>{ window.location = '/friends.html'; });
      document.getElementById('goalsBtn').addEventListener('click', ()=>{ window.location = '/goals'; });
    </script>
  </body>
</html>
